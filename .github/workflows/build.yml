name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble both editions
        run: gradle :app:assembleFullDebug :app:assembleLiteDebug --no-daemon --stacktrace

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: nijatva-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error

      - name: Upload lite APK
        uses: actions/upload-artifact@v4
        with:
          name: nijatva-lite-debug
          path: app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
